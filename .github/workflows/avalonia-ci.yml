name: Avalonia GUI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            bundle: THRM-avalonia-windows-x64
            core_name: THRM Core.exe
            artifact: THRM-avalonia-windows-x64.zip
          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
            bundle: THRM-avalonia-linux-x64
            core_name: thrm-core
            artifact: THRM-avalonia-linux-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux Core build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libhidapi-dev libudev-dev

      - name: Publish runnable Avalonia bundle
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          BUNDLE: ${{ matrix.bundle }}
          CORE_NAME: ${{ matrix.core_name }}
        run: |
          set -euo pipefail
          output="dist/$BUNDLE"
          dotnet publish gui/THRM.Avalonia/THRM.Avalonia.csproj \
            --configuration Release \
            --runtime "$RID" \
            --self-contained true \
            --output "$output"
          CGO_ENABLED=1 go build -trimpath -o "$output/$CORE_NAME" ./cmd/core

      - name: Run IPC self-check
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            "dist/$BUNDLE/THRM.Avalonia.exe" --self-check
          else
            "dist/$BUNDLE/THRM.Avalonia" --self-check
          fi

      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUNDLE: ${{ matrix.bundle }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          Compress-Archive -Path (Join-Path "dist/$env:BUNDLE" '*') -DestinationPath "dist/$env:ARTIFACT" -Force

      - name: Archive Linux bundle
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
          ARTIFACT: ${{ matrix.artifact }}
        run: tar -C dist -czf "dist/$ARTIFACT" "$BUNDLE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}-${{ github.sha }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
