name: Avalonia GUI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            bundle: THRM-avalonia-windows-x64
            core_name: THRM Core.exe
            ui_name: THRM
            artifact: THRM-avalonia-windows-x64.zip
          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
            bundle: THRM-avalonia-linux-x64
            core_name: thrm-core
            ui_name: thrm
            artifact: THRM-avalonia-linux-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Install Windows Core build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@latest
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE 'go\bin')

      - name: Build Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: cmd
        run: build_bridge.bat

      - name: Install Linux Core build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libhidapi-dev libudev-dev

      - name: Publish runnable Avalonia bundle
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          BUNDLE: ${{ matrix.bundle }}
          CORE_NAME: ${{ matrix.core_name }}
          UI_NAME: ${{ matrix.ui_name }}
        run: |
          set -euo pipefail
          output="dist/$BUNDLE"
          dotnet publish gui/THRM.Avalonia/THRM.Avalonia.csproj \
            --configuration Release \
            --runtime "$RID" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:AssemblyName="$UI_NAME" \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            --output "$output"
          version=$(grep -oE '"productVersion"[[:space:]]*:[[:space:]]*"[^"]+"' wails.json | sed -E 's/.*"([^"]+)"$/\1/')
          ldflags="-s -w -X github.com/TIANLI0/THRM/internal/version.BuildVersion=${version:-dev}"
          if [ "$RUNNER_OS" = Windows ]; then
            go-winres make --in cmd/core/winres/winres.json --out cmd/core/rsrc
            ldflags="$ldflags -H=windowsgui"
          fi
          CGO_ENABLED=1 go build -trimpath -ldflags "$ldflags" -o "$output/$CORE_NAME" ./cmd/core
          if [ "$RUNNER_OS" = Windows ]; then
            cp -R build/bin/bridge "$output/bridge"
            mkdir -p "$output/drivers/PawnIO"
            cp build/bin/PawnIO_setup.exe "$output/drivers/PawnIO/PawnIO_setup.exe"
          fi

      - name: Run IPC self-check
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
          UI_NAME: ${{ matrix.ui_name }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            "dist/$BUNDLE/$UI_NAME.exe" --self-check
            test -f "dist/$BUNDLE/bridge/THRM TempBridge.exe"
            test -f "dist/$BUNDLE/drivers/PawnIO/PawnIO_setup.exe"
          else
            "dist/$BUNDLE/$UI_NAME" --self-check
          fi

      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUNDLE: ${{ matrix.bundle }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          Compress-Archive -Path (Join-Path "dist/$env:BUNDLE" '*') -DestinationPath "dist/$env:ARTIFACT" -Force

      - name: Archive Linux bundle
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
          ARTIFACT: ${{ matrix.artifact }}
        run: tar -C dist -czf "dist/$ARTIFACT" "$BUNDLE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}-${{ github.sha }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
