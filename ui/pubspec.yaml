name: thrm_ui
description: "THRM Flutter 3 rendering and IPC experiment"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dart_ipc: 2.0.0
  file_selector: ^1.0.3
  fluent_ui: ^4.16.1
  flutter:
    sdk: flutter
  flutter_acrylic: ^1.1.4
  flutter_localizations:
    sdk: flutter
  record: ^6.1.2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/appicon.png
    - assets/locales/
